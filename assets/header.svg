<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Yanbo Bian — Reliable and Efficient Machine Learning</title>
  <desc id="desc">Academic profile of Yanbo Bian, an undergraduate at Beijing Jiaotong University. Navy and teal design with an abstract forecast and calibration motif.</desc>
  <defs>
